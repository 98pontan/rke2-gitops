# ESO logs in to Vault as this service account.
# Vault role "app" must allow the SA argo-eso in namespace argo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-eso
  namespace: argo
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argo-vault
  namespace: argo
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app
          serviceAccountRef:
            name: argo-eso
