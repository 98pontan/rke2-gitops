# Keycloak login for the Argo Workflows UI.
# Needs Vault property OIDC_CLIENT_SECRET at secret/argo/sso
# (Keycloak -> Clients -> argo-workflows -> Credentials -> Client secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-server-sso
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argo-vault
    kind: SecretStore
  target:
    name: argo-server-sso
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: argo-workflows
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: argo/sso
        property: OIDC_CLIENT_SECRET
---
# Token the release workflow uses to clone the app repos, merge into main on GitHub and
# promote the image in rke2-gitops. Needs Vault property GITHUB_TOKEN at secret/argo/release:
# a fine-grained GitHub token for 98pontan/morning-times, 98pontan/morning-times-ui and
# 98pontan/rke2-gitops with "Contents: read and write".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-release
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argo-vault
    kind: SecretStore
  target:
    name: github-release
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argo/release
        property: GITHUB_TOKEN
---
# Shared secret Forgejo sends with webhook calls (header "Authorization: Bearer <token>").
# Needs Vault property WEBHOOK_TOKEN at secret/argo/release (any long random string).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-webhook
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argo-vault
    kind: SecretStore
  target:
    name: forgejo-webhook
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argo/release
        property: WEBHOOK_TOKEN
