# Creates Secret harbor-secrets from Vault secret/harbor/harbor.
# Create it once before the first sync, e.g.:
#
#   HTPASSWD_PASS=$(openssl rand -hex 16)
#   vault kv put secret/harbor/harbor \
#     HARBOR_ADMIN_PASSWORD='<initial admin password>' \
#     secretKey=$(openssl rand -hex 8) \
#     secret=$(openssl rand -hex 8) \
#     CSRF_KEY=$(openssl rand -hex 16) \
#     JOBSERVICE_SECRET=$(openssl rand -hex 8) \
#     REGISTRY_HTTP_SECRET=$(openssl rand -hex 8) \
#     REGISTRY_PASSWD="$HTPASSWD_PASS" \
#     REGISTRY_HTPASSWD="$(htpasswd -nbB harbor_registry_user "$HTPASSWD_PASS")"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: harbor-vault
    kind: SecretStore
  target:
    name: harbor-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: harbor/harbor
