# ESO logs in to Vault as this service account.
# Vault role "app" must allow the SA harbor-eso in namespace harbor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-eso
  namespace: harbor
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-vault
  namespace: harbor
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app
          serviceAccountRef:
            name: harbor-eso
