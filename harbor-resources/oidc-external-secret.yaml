# Harbor OIDC login via Keycloak (realm homelab), same group names as ArgoCD.
# Builds Secret harbor-oidc with key CONFIG_OVERWRITE_JSON, which harbor-core reads
# at startup (values: core.extraEnvVars). Settings set here are read-only in the UI.
#
# Needs Vault property OIDC_CLIENT_SECRET at secret/harbor/harbor
# (Keycloak -> Clients -> harbor -> Credentials -> Client secret).
#
# harbor-core only reads this at startup. After changing it:
#   kubectl -n harbor rollout restart deploy/harbor-core
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: harbor-vault
    kind: SecretStore
  target:
    name: harbor-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CONFIG_OVERWRITE_JSON: |
          {
            "auth_mode": "oidc_auth",
            "oidc_name": "Keycloak",
            "oidc_endpoint": "https://keycloak.pontus-homelab.space/auth/realms/homelab",
            "oidc_client_id": "harbor",
            "oidc_client_secret": {{ .OIDC_CLIENT_SECRET | toJson }},
            "oidc_scope": "openid,profile,email,offline_access",
            "oidc_user_claim": "preferred_username",
            "oidc_groups_claim": "groups",
            "oidc_admin_group": "admin",
            "oidc_auto_onboard": true,
            "oidc_verify_cert": true
          }
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: harbor/harbor
        property: OIDC_CLIENT_SECRET
