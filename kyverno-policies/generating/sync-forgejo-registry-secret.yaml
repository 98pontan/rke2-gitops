apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-forgejo-registry-secret
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: not-excluded-namespace
      expression: >-
        !(object.metadata.name in ["kube-system", "kube-public", "kube-node-lease", "platform"])
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "platform", "forgejo-registry")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])
