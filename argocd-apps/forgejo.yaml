apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  # Uses the 'infra' or 'devops-tools' AppProject we discussed earlier
  project: infra
  sources:
    - repoURL: 'code.forgejo.org/forgejo-helm'
      chart: forgejo
      targetRevision: 17.1.0 # Latest verified stable Helm wrapper version
      helm:
        valueFiles:
          - $values/values/forgejo/values.yaml
    - repoURL: 'https://github.com/98pontan/rke2-gitops.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-ci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
