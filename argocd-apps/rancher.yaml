apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: 'https://releases.rancher.com/server-charts/stable'
      chart: rancher
      targetRevision: v2.14.2 # Replace with your desired Rancher version
      helm:
        valueFiles:
          - $values/values/rancher/values.yaml
    - repoURL: 'https://github.com/98pontan/rke2-gitops.git'
      targetRevision: main
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cattle-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
