apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://repo.helmforge.dev
      chart: cloudflared
      targetRevision: "*" # pin to a specific version once you confirm one
      helm:
        valueFiles:
          - $values/values/cloudflare-tunnel/values.yaml
    - repoURL: 'https://github.com/98pontan/rke2-gitops.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
