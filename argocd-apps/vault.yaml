apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: infra
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: v0.34.1
      helm:
        valueFiles:
          - $values/values/vault/values.yaml
    - repoURL: https://github.com/98pontan/rke2-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
