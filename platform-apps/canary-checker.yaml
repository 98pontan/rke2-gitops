apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-checker
  namespace: argocd
spec:
  project: infra
  sources:
  - repoURL: https://flanksource.github.io/charts
    chart: canary-checker
    targetRevision: "1.2.0"
    helm:
      valueFiles:
        - $values/values/canary-checker/values.yaml
  - repoURL: https://github.com/98pontan/rke2-gitops.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-checker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
