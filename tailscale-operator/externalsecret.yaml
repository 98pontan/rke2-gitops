# Creates the Secret "operator-oauth" (client_id, client_secret) that the Tailscale operator reads.
# Vault: secret/data/tailscale/operator-oauth with properties client_id and client_secret.
# Synced before the chart (wave -1) so the operator starts with its credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Same role as the apps: its policy allows secret/data/<namespace>/*
          role: app
          serviceAccountRef:
            name: eso-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/operator-oauth
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/operator-oauth
        property: client_secret
