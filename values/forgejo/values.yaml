gitea:
  config:
    server:
      DOMAIN: "forgejo.pontus-homelab.space"
      ROOT_URL: "https://forgejo.pontus-homelab.space/"
      HTTP_PORT: 3000
      # FIXED: Explicitly tell the UI engine to construct links using port 2222
      SSH_DOMAIN: "forgejo.pontus-homelab.space"
      SSH_PORT: 2222
      START_SSH_SERVER: true # Ensures Forgejo spins up its internal SSH listener
    packages:
      ENABLED: "true"
    actions:
      ENABLED: "true"
    service:
      DISABLE_REGISTRATION: false
      REQUIRE_SIGNIN_VIEW: true
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true   # auto-create Forgejo users on first Keycloak login
      USERNAME: "preferred_username"    # or "email"/"nickname" depending on your claims
      UPDATE_AVATAR: true
      ACCOUNT_LINKING: "auto"

persistence:
  enabled: true
  storageClass: "longhorn"
  size: "20Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.kubernetes.io/worker
              operator: In
              values:
                - "true"
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
  tls:
    - secretName: forgejo-tls
      hosts:
        - forgejo.pontus-homelab.space
  hosts:
    - host: forgejo.pontus-homelab.space
      paths:
        - path: /
          pathType: Prefix

service:
  ssh:
    enabled: true
    type: ClusterIP
    port: 22
