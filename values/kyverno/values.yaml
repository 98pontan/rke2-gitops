# kyverno-values.yaml

# Install/upgrade the CRDs with the chart
crds:
  install: true

# Reusable worker-node affinity
x-worker-affinity: &workerAffinity
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.kubernetes.io/worker
              operator: In
              values:
                - "true"

admissionController:
  affinity: *workerAffinity
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backgroundController:
  affinity: *workerAffinity
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

reportsController:
  affinity: *workerAffinity
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

cleanupController:
  affinity: *workerAffinity
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

features:
  policyExceptions:
    enabled: false     # set true if you want PolicyException resources
  omitEvents:
    eventTypes:
      - PolicyApplied
      - PolicySkipped
