# kyverno-values.yaml

# Install/upgrade the CRDs with the chart
crds:
  install: true
  groups:
    kyverno:
      clusterpolicies: true
      policies: true

# ServiceMonitor settings shared by all four controllers
x-service-monitor: &serviceMonitor
  enabled: true
  additionalLabels:
    release: prometheus-stack

# Reusable worker-node affinity
x-worker-affinity: &workerAffinity
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.kubernetes.io/worker
              operator: In
              values:
                - "true"

admissionController:
  affinity: *workerAffinity
  serviceMonitor: *serviceMonitor
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backgroundController:
  affinity: *workerAffinity
  serviceMonitor: *serviceMonitor
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

reportsController:
  affinity: *workerAffinity
  serviceMonitor: *serviceMonitor
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

cleanupController:
  affinity: *workerAffinity
  serviceMonitor: *serviceMonitor
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

features:
  policyExceptions:
    enabled: false     # set true if you want PolicyException resources
  omitEvents:
    eventTypes:
      - PolicyApplied
      - PolicySkipped

# The chart ships the official Kyverno dashboard as a ConfigMap; the Grafana
# sidecar picks it up from any namespace via the grafana_dashboard label.
grafana:
  enabled: true
  annotations:
    grafana_folder: "Platform"
