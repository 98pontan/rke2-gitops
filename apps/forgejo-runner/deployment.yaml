apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: devops-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "node.kubernetes.io/worker"
                    operator: In
                    values:
                      - "true"
      volumes:
        - name: runner-data
          emptyDir: {}
        - name: runner-config-vol
          configMap:
            name: forgejo-runner-config-reg
        - name: docker-socket
          emptyDir: {}   # shared /var/run between dind and runner

      containers:
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

        # Fixes socket permissions as soon as dockerd creates it
        - name: socket-permission-fixer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for docker.sock..."
              until [ -S /var/run/docker.sock ]; do sleep 1; done
              chmod 666 /var/run/docker.sock
              echo "Permissions fixed, idling..."
              sleep infinity
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run

        - name: runner
          image: data.forgejo.org/forgejo/runner:12
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yaml"]
          volumeMounts:
            - name: runner-config-vol
              mountPath: /config
            - name: runner-data
              mountPath: /data
            - name: docker-socket
              mountPath: /var/run
