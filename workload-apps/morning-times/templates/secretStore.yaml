{{- if and .Values.eso.enabled .Values.eso.secrets }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "app.fullname" . }}-vault
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ required "eso.server is required (in-cluster Vault URL)" .Values.eso.server | quote }}
      path: {{ default "secret" .Values.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.eso.authMountPath | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "app.serviceAccountName" . }}
            {{- with .Values.eso.audiences }}
            audiences:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
