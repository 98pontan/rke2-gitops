# -- Override the chart name used in resource names and the app.kubernetes.io/name label.
# Must stay "iss-tracker": the live Deployment selector uses it and selectors are immutable
nameOverride: "iss-tracker"
# -- Override the full resource name (default: <release>-<chart>, or just <release> if it contains the chart name)
# Keeps resource names short: Deployment/Service/SA "iss-tracker", Secret "iss-tracker-config"
fullnameOverride: "iss-tracker"

# -- Number of replicas. Keep at 1: every replica runs its own checks and would send its own email
replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: forgejo.pontus-homelab.space/python-apps/iss-tracker
  # -- Defaults to Chart.appVersion when empty
  tag: "latest"
  # -- Pin by digest (sha256:...). Takes precedence over tag when set
  digest: ""
  # -- Always, since the tag is "latest" (IfNotPresent would keep running a cached old image)
  pullPolicy: Always

# -- Pull secrets for the private registry. The secret must exist in the release namespace
# forgejo-registry is copied into every namespace by the Kyverno policy sync-forgejo-registry-secret
imagePullSecrets:
  - name: forgejo-registry

serviceAccount:
  # -- ESO logs in to Vault with this service account (Vault role vault.role must allow it)
  create: true
  # -- Defaults to the fullname when empty
  name: ""
  annotations: {}
  # -- The app never talks to the Kubernetes API (ESO requests its own token)
  automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# HashiCorp Vault Agent Injector
# ---------------------------------------------------------------------------
vault:
  enabled: false
  # -- Vault Kubernetes auth role. Access is scoped by the role's policy to secret/data/<namespace>/*
  role: app
  # -- KV v2 mount name
  mount: secret
  # -- Run the agent as a pre-populate-only init container (no sidecar). Use for Jobs or when secrets never change
  prePopulateOnly: false
  # -- Run the agent init container before other init containers
  initFirst: false
  # -- Secrets to inject. Each one becomes a file at /vault/secrets/<name>
  #
  # path:     relative paths are resolved to <mount>/data/<namespace>/<path>.
  #           A path starting with "<mount>/" is used as is (it must include /data/ for KV v2).
  #           Defaults to the secret's name.
  # template: optional Vault Agent template to control the file format.
  #
  # secrets:
  #   - name: config
  #     path: config
  #   - name: db
  #     path: myapp/db
  #     template: |
  #       {{- with secret "secret/data/mynamespace/myapp/db" -}}
  #       DB_USER={{ .Data.data.user }}
  #       DB_PASSWORD={{ .Data.data.password }}
  #       {{- end }}
  secrets: []
  # -- Extra vault.hashicorp.com/* annotations (override the generated ones), e.g.
  # vault.hashicorp.com/agent-requests-cpu: 50m
  # vault.hashicorp.com/agent-limits-cpu: 250m
  # vault.hashicorp.com/agent-requests-mem: 64Mi
  # vault.hashicorp.com/agent-limits-mem: 128Mi
  annotations: {}

# ---------------------------------------------------------------------------
# Container
# ---------------------------------------------------------------------------
# -- Port the app listens on. Set to null for workloads with no port
containerPort: 8080

command: []
args: []

# -- Environment variables as a simple map: NAME: value
env:
  LOG_LEVEL: info
  APP_EMAIL__RECEIVER: pjirbratt@yahoo.com
  APP_LOCATION__NAME: Stockholm
  APP_LOCATION__LATITUDE: "59.3293"
  APP_LOCATION__LONGITUDE: "18.0686"
  APP_SCHEDULER__INTERVAL_SECONDS: "60"

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10

# -- Raw env entries for valueFrom (secretKeyRef, configMapKeyRef, fieldRef)
envRaw: []
#  - name: API_KEY
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: api-key

# -- envFrom sources (configMapRef / secretRef)
envFrom: []


startupProbe: {}

lifecycle: {}
terminationGracePeriodSeconds: null

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Extra volumes and mounts (e.g. an emptyDir at /tmp when readOnlyRootFilesystem is true)
volumes: []
#  - name: tmp
#    emptyDir: {}
volumeMounts: []
#  - name: tmp
#    mountPath: /tmp

# ---------------------------------------------------------------------------
# Pod metadata and scheduling
# ---------------------------------------------------------------------------
# -- Annotations on the Deployment
deploymentAnnotations: {}
# -- Annotations on the pod template (merged with the generated Vault annotations)
podAnnotations: {}
podLabels: {}

strategy: {}
#  type: RollingUpdate
#  rollingUpdate:
#    maxUnavailable: 0
#    maxSurge: 1

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Service, Ingress, scaling
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  port: 80
  # -- Container port name or number
  targetPort: http
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  hosts: []
  #  - host: myapp.pontus-homelab.space
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: myapp-tls
  #    hosts:
  #      - myapp.pontus-homelab.space

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# ---------------------------------------------------------------------------
# External Secrets Operator: reads Vault secret/data/iss-tracker/config (property "password")
# and creates the Secret iss-tracker-config, exposed to the pod as env var EMAIL_PASSWORD.
# Env vars are read at pod start: after changing the password, run
#   kubectl -n iss-tracker rollout restart deploy/iss-tracker
# ---------------------------------------------------------------------------
eso:
  enabled: true
  server: "http://vault.vault.svc.cluster.local:8200"
  authMountPath: kubernetes
  audiences: []
  refreshInterval: 1h
  secrets:
    - name: config
      path: config
      envFrom: true
      refreshInterval: 15m
      type: Opaque
      keys:
        - secretKey: EMAIL_PASSWORD
          property: EMAIL_PASSWORD
