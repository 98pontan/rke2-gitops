{{- if .Values.eso.enabled }}
{{- range .Values.eso.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.esoSecretName" (dict "root" $ "secret" .) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ default $.Values.eso.refreshInterval .refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "app.fullname" $ }}-vault
    kind: SecretStore
  target:
    name: {{ include "app.esoSecretName" (dict "root" $ "secret" .) }}
    creationPolicy: Owner
    {{- with .type }}
    template:
      type: {{ . }}
    {{- end }}
  {{- $key := default (printf "%s/%s" $.Release.Namespace (default .name .path)) .key }}
  {{- if .keys }}
  data:
    {{- range .keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $key | quote }}
        property: {{ .property }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $key | quote }}
  {{- end }}
{{- end }}
{{- end }}
