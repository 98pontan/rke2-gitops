apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vault
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  vault.json: |
    {
      "uid": "vault-overview",
      "title": "Vault",
      "tags": [
        "vault",
        "platform"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Status",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Seal status",
          "description": "Metrics are only served by the active, unsealed node. No data here usually means Vault is sealed.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(vault_core_unsealed)",
              "legendFormat": "",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "SEALED",
                      "color": "red"
                    },
                    "1": {
                      "text": "UNSEALED",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Scrape target",
          "description": "",
          "id": 3,
