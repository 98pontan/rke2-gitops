              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table",
              "expr": "max by (namespace, verticalpodautoscaler, target_name, container) (kube_customresource_vpa_recommendation_target{resource=\"memory\"})"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "pod": true,
                  "unit": true,
                  "resource": true,
                  "customresource_group": true,
                  "customresource_kind": true,
                  "customresource_version": true,
                  "target_kind": true
                },
                "renameByName": {
                  "Value #A": "CPU target",
                  "Value #B": "Memory target",
                  "verticalpodautoscaler": "VPA",
                  "target_name": "Workload"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU target"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "cores"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory target"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
