apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vpa
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  vpa.json: |
    {
      "uid": "vpa-overview",
      "title": "Vertical Pod Autoscaler",
      "tags": [
        "vpa",
        "platform"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_customresource_vpa_recommendation_target, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(kube_customresource_vpa_recommendation_target, namespace)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "current": {},
            "hide": 0
          },
          {
            "name": "vpa",
            "label": "VPA",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_customresource_vpa_recommendation_target{namespace=\"$namespace\"}, verticalpodautoscaler)",
              "refId": "vpa"
            },
            "definition": "label_values(kube_customresource_vpa_recommendation_target{namespace=\"$namespace\"}, verticalpodautoscaler)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "current": {},
            "hide": 0
          },
          {
            "name": "target",
            "label": "Workload",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_customresource_vpa_recommendation_target{namespace=\"$namespace\", verticalpodautoscaler=\"$vpa\"}, target_name)",
              "refId": "target"
            },
            "definition": "label_values(kube_customresource_vpa_recommendation_target{namespace=\"$namespace\", verticalpodautoscaler=\"$vpa\"}, target_name)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "current": {},
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "All VPAs",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "VPA objects",
          "description": "",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(count by (namespace, verticalpodautoscaler) (kube_customresource_vpa_recommendation_target))",
              "legendFormat": "",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
